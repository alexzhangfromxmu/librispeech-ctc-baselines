_base_: ../base.yaml

experiment:
  name: transformer_ctc_100h

model:
  name: transformer_ctc
  d_model: 256
  encoder_layers: 5
  attention_heads: 4
  feedforward_size: 1024
  dropout: 0.1

training:
  learning_rate: 0.001
  weight_decay: 0.01
  gradient_clip: 1.0
  early_stopping_patience: 10
  amp_dtype: bfloat16
  scheduler:
    name: cosine_with_warmup
    warmup_ratio: 0.05
