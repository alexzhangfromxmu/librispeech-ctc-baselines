_base_: ../base.yaml

experiment:
  name: mamba2_ctc_100h_100epoch

model:
  name: mamba2_ctc
  d_model: 256
  mamba_layers: 10
  d_state: 64
  d_conv: 4
  expand: 2
  headdim: 64
  chunk_size: 256
  dropout: 0.1

training:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.01
  gradient_clip: 1.0
  early_stopping_patience: 10
  amp: true
  amp_dtype: bfloat16
  scheduler:
    name: cosine_with_warmup
    warmup_ratio: 0.05
