_base_: ../base.yaml

experiment:
  name: bilstm_ctc_100h

model:
  name: bilstm_ctc
  hidden_size: 256
  lstm_layers: 3
  dropout: 0.2

training:
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip: 5.0
  early_stopping_patience: 7
  amp_dtype: float16
  scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 2
    min_lr: 0.00001
