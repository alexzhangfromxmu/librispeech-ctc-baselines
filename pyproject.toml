[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "librispeech-ctc"
version = "0.1.0"
description = "Modular BiLSTM-CTC and Transformer-CTC training for LibriSpeech"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "soundfile>=0.12",
    "torch>=2.1",
    "torchaudio>=2.1",
]

[project.optional-dependencies]
mamba = ["mamba-ssm[causal-conv1d]==2.3.2.post1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
